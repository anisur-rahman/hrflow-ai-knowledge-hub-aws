name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hrflow
          POSTGRES_PASSWORD: hrflow_dev
          POSTGRES_DB: hrflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hrflow:hrflow_dev@localhost:5432/hrflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend workers tests
      - run: python -m pytest -q  # tests/ at the repo root cover backend/ and workers/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform init -backend=false -input=false && terraform -chdir=infrastructure/terraform validate
      - run: terraform -chdir=infrastructure/terraform/bootstrap init -backend=false -input=false && terraform -chdir=infrastructure/terraform/bootstrap validate

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images (no push)
        run: |
          docker build -f backend/Dockerfile --target runtime -t api .
          docker build -f workers/Dockerfile -t worker .
          docker build -t web frontend
