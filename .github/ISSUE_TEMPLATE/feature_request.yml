name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the problem first; the best solution can then be discussed before anyone writes code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and who is affected (HR admins, employees, operators)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: impact
    attributes:
      label: Does it affect any of these?
      multiple: true
      options:
        - Security or access control
        - AWS cost (new or larger resources)
        - Database schema (needs a migration)
        - AI behaviour or prompts
        - None of these
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md).
