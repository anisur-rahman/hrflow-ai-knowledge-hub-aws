server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 11m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # PrimeVue injects theme styles at runtime, hence 'unsafe-inline' for styles only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.amazoncognito.com" always;

  # Local Docker Compose mounts an /api proxy here; in AWS the load balancer routes /api to the API service.
  include /etc/nginx/api-proxy/*.conf;

  # Use `expires`, not add_header, in locations: a location-level add_header drops the server-level headers above.
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
