services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: hrflow
      POSTGRES_USER: hrflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrflow_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrflow -d hrflow"]
      interval: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: { context: ., dockerfile: backend/Dockerfile, target: runtime }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hrflow:${POSTGRES_PASSWORD:-hrflow_dev}@postgres:5432/hrflow
      RUN_MIGRATIONS: "true"
    volumes:
      - uploads:/app/uploads
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/nginx-local-proxy.conf:/etc/nginx/api-proxy/local.conf:ro
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    depends_on: [backend]

  # docker compose --profile test run --rm tests
  tests:
    profiles: [test]
    build: { context: ., dockerfile: backend/Dockerfile, target: test }
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://hrflow:${POSTGRES_PASSWORD:-hrflow_dev}@postgres:5432/hrflow_test
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
